<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verteiler">
<title>Verteilerplanung Schachenmann</title>
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: helle Seite, Logozeile, weisses Band mit Schaltschema-Motiv und gelber Linie, darunter Karten. Gelb als Akzent nach Schachenmann. */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --ink:#141414; --muted:#5f5f5a; --line:#dcdcd5; --field:#ffffff;
  --head:#ffffff; --accent:#ffed00; --accent-ink:#111111; --link:#5c5200; --focus:#111111;
  --err:#b42318; --err-soft:#fdecea; --ok:#1d7a46; --ok-soft:#e3f3e9; --info-soft:#fff9c2; --info:#4a4300;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#ffffff;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrapx{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Logozeile: immer weiss, damit das Originallogo stimmt */
.brandbar{background:#ffffff;color:#141414;padding-top:env(safe-area-inset-top,0px)}
.brandbar .wrapx{padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lg{display:flex;flex-direction:column;gap:5px}
.lg img{height:36px;width:auto;max-width:100%;display:block}
.start .lg img{height:clamp(44px,10vw,64px)}
.tagline{font-size:12px;color:#6b6b64;letter-spacing:.05em}
.wordmark{font:800 italic 30px/1 var(--f-display);color:#111}
.bk img{height:30px;width:auto;display:block}

/* Schwarzes Band */
.hero{position:relative;background:var(--head);color:var(--ink);overflow:hidden;border-top:1px solid #ecece6}
.hero svg.pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero .yb{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--accent)}
.hero .wrapx{position:relative;padding-block:26px 112px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.start .hero .wrapx{padding-block:30px 120px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.topbar .who{opacity:.85;margin-right:4px}
.topbar .btn{background:#fff;border-color:var(--line);color:var(--ink)}
.topbar .btn:hover{border-color:var(--ink)}
.pagehead h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em;color:var(--ink)}

/* Inhalt */
.main{margin-top:-90px;padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));position:relative;display:flex;flex-direction:column;gap:20px}
.start .main{margin-top:-104px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:4px;padding:24px;box-shadow:0 14px 34px -22px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:18px;min-width:0}
.card.narrow{max-width:440px;width:100%}
.card h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:14px}
.muted{color:var(--muted);font-weight:500}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;position:relative}
label.f .hint{font-weight:400;color:var(--muted)}
input,select{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--ink)}
input:disabled::placeholder{color:transparent}
input:disabled,select:disabled{opacity:1;background:var(--bg);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#111;color:var(--accent);border-color:#111}
.btn.small{padding:7px 11px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--link);font-weight:600}
.btn.danger{color:var(--err)}
.msg{border-radius:4px;padding:10px 12px;font-size:14px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--info-soft);color:var(--info)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:640px){.c4,.c3,.c2{grid-column:span 6}.card{padding:18px}}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;padding:3px;gap:3px;background:var(--bg)}
.seg button{flex:1;border:0;background:none;border-radius:3px;padding:9px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}
.seg button:disabled{cursor:default}
.seg button b{font:700 15px var(--f-display)}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#111}
.seg button[aria-pressed="true"] span{color:#3a3a00}
.legend{font-size:13px;font-weight:600;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.y{background:var(--accent);color:#111;border-color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.lock{background:transparent}
.actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:0 -24px -24px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:2}
@media (max-width:640px){.actions{margin:0 -18px -18px;padding-left:18px;padding-right:18px}}
.saved{font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.foot .btn.link{color:var(--muted);font-size:12px;font-weight:500}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.chk input{width:18px;height:18px;padding:0}
.share{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

/* Übersicht */
.tools{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tools{grid-template-columns:1fr 1fr}.tools .q{grid-column:span 2}}
.sites{display:flex;flex-direction:column}
.site{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.site:last-child{border-bottom:0}
.site .t{font:700 16px var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.site .d{color:var(--muted);font-size:14px}
.site .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.site .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.site{grid-template-columns:1fr}.site .acts{justify-content:flex-start}}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.ulist{display:flex;flex-direction:column}
.uitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.uitem:last-child{border-bottom:0}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 0 4px}
.st{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.st b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);font-size:11px}
.st.on{border-color:#111}.st.on b{background:var(--accent);color:#111}
.st.done b{background:#111;color:var(--accent)}
.st:disabled{opacity:.45;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tiles.two-col{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile b{font:700 15px var(--f-display)}.tile span{font-size:12px;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#111}.tile[aria-pressed="true"] span{color:#3a3a00}
.tile:disabled{cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:#111;color:var(--accent);border-color:#111}
#printSheet svg{page-break-after:always;break-after:page}
.plangrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.plangrid{grid-template-columns:minmax(0,1fr)}}
.sk{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.sk1{display:flex;gap:8px;align-items:center}.sk1 input{flex:1;padding:9px 10px}
.sk2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sk .m{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.sk select{padding:8px 2px 8px 6px;font-size:14px;color:var(--ink)}
.sk .x{padding:8px 0;width:40px;color:var(--muted);flex:none}
.skt{flex:none}
.zlr{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;border-bottom:1px solid var(--line)}.zlr.res{background:#fafafa;border-style:dashed}.zlno{min-width:40px;font-size:16px}.zlsel{max-width:210px;padding:8px}
.kabq{display:flex;flex-wrap:wrap;gap:8px}.kq{display:inline-flex;gap:6px;align-items:center;font-size:13px}.kq select{width:auto;padding:6px 8px;font-size:13px}
.sk3{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}.sk3 .m select{height:38px;padding:6px 8px;font-size:13px;width:auto;min-width:140px}
.rl{display:inline-flex;align-items:center;gap:6px;background:var(--info-soft);border:1px solid #e6dc6a;border-radius:3px;padding:4px 4px 4px 8px;font-size:13px}
.rl button{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 6px}
.rladd{width:auto;padding:6px 8px;font-size:13px}.chk.small{font-size:13px}.te{border-collapse:collapse;width:100%;font-size:14px}.te td{padding:6px 0;border-bottom:1px solid var(--line)}.te td:last-child{text-align:right;font-weight:600}.te tr.sum td{font-weight:700}.chk input.pct{width:72px;height:auto;padding:6px 8px;font-size:15px}
.chk.off{color:var(--muted);opacity:.6}.chk.small input{width:16px;height:16px}
.sk .note{padding:7px 10px;font-size:14px}.kab{font-size:14px;color:var(--ink);font-weight:500;padding:8px 0}
.skn{display:flex;flex-direction:column;gap:2px;font-size:13px}.skn .nt{color:var(--info)}.skn .warn{color:var(--err);font-weight:600}
.alarm{border:2px solid var(--err);display:flex;flex-direction:column;gap:8px;font-size:15px}.ackd{font-weight:600}
.btn.danger{background:var(--err);color:#fff;border-color:var(--err)}
@media (max-width:640px){.sk2{grid-template-columns:repeat(3,minmax(0,1fr))}.skt{display:none}}
.ptabs{display:flex;gap:4px;flex-wrap:wrap}.ptabs .tab{padding:4px 8px;font-size:12px}
.prevbox{border:1px solid var(--line);padding:0;background:#fff;cursor:zoom-in;display:block;width:100%;border-radius:2px}
.prevbox svg,.schemabox svg{width:100%;height:auto;display:block}
.schemabox{overflow-x:auto;border:1px solid var(--line);background:#fff}
.schemabox svg{min-width:860px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary:disabled:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
body.ps .brandbar{display:none!important}
#printSheet svg{width:100%;height:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}

/* Druckblatt */
#printSheet{display:none}
@media print{
  @page{margin:16mm}
  body{background:#fff;color:#000}
  .hero,.main,.foot,.bk{display:none!important}
  .brandbar{border:0;padding:0}
  #printSheet{display:block;font-size:12pt;color:#000}
  #printSheet h1{font-size:20pt;margin:12pt 0 4pt}
  #printSheet table{border-collapse:collapse;width:100%;margin-top:10pt}
  #printSheet td{border-bottom:1px solid #ccc;padding:6pt 4pt;vertical-align:top}
  #printSheet td:first-child{width:38%;color:#555}
  #printSheet .pf{margin-top:18pt;font-size:9pt;color:#666}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="brandbar"><div class="wrapx">
  <div class="lg"><div id="logo"><span class="wordmark">Schachenmann</span></div><div class="tagline">Planungssoftware Service und Unterhalt</div></div>
  <div class="bk" id="bk"></div>
</div></div>
<header class="hero" id="hero">
  <svg class="pattern" id="pattern" aria-hidden="true"></svg>
  <div class="yb" aria-hidden="true"></div>
  <div class="wrapx">
    <div class="pagehead" id="pagehead"></div>
    <div class="topbar" id="topbar"></div>
  </div>
</header>
<div class="main wrapx" id="main"></div>
<div id="printSheet"></div>
<datalist id="dlKom"></datalist><datalist id="dlNB"></datalist><datalist id="dlBereich"></datalist><datalist id="dlOrt"></datalist><datalist id="dlPlz"></datalist><datalist id="dlFilterOrt"></datalist>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
const KEY='vp.v2';
const START_NAMES=['Cihad Mekikli','Marco Winkler','Shajatan Kumar','Mumin Jakupi','Tobias Müller','Lionel Mazard'];
const LAENDER=[['CH','Schweiz'],['LI','Liechtenstein'],['DE','Deutschland'],['AT','Österreich'],['FR','Frankreich']];
const STOCK=['2.UG','1.UG','EG','1.OG','2.OG','3.OG','4.OG','5.OG','6.OG','7.OG','8.OG','9.OG'];
const BEREICHE=['Allgemeinbereich','Wohnungsintern','Gewerbe','Büro','Technikraum','Tiefgarage','Aussenbereich','Treppenhaus','Keller'];
const KANTONE=[['AG','Aargau'],['AI','Appenzell Innerrhoden'],['AR','Appenzell Ausserrhoden'],['BE','Bern'],['BL','Basel-Landschaft'],['BS','Basel-Stadt'],['FR','Freiburg'],['GE','Genf'],['GL','Glarus'],['GR','Graubünden'],['JU','Jura'],['LU','Luzern'],['NE','Neuenburg'],['NW','Nidwalden'],['OW','Obwalden'],['SG','St. Gallen'],['SH','Schaffhausen'],['SO','Solothurn'],['SZ','Schwyz'],['TG','Thurgau'],['TI','Tessin'],['UR','Uri'],['VD','Waadt'],['VS','Wallis'],['ZG','Zug'],['ZH','Zürich']];
const nid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const now=()=>new Date().toISOString();

/* ---------- Speicher (localStorage dieses Browsers) ---------- */
let D;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
if(!D||!Array.isArray(D.users)) D={users:START_NAMES.map(n=>({id:nid(),name:n})),admin:null};
D.sites=D.sites||[];
if(D.projects){Object.entries(D.projects).forEach(([uid,p])=>{if(p&&(p.kom||p.adr)){D.sites.push({id:nid(),owner:uid,kom:p.kom||'',bauherr:'',adr:p.adr||'',plz:p.plz||'',ort:p.ort||'',kanton:'',land:p.land||'CH',norm:p.norm||'NIN',art:p.art||'UV',created:now(),updated:now()})}});delete D.projects}
delete D.branding;
D.sites.forEach(s=>{if(!Array.isArray(s.editors))s.editors=[]});
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){return false}}
save();

let S={screen:'start',user:null,admin:false,msg:null,sel:'',site:null,isNew:false,savedAt:null,q:'',fNorm:'',fKanton:'',fOrt:'',onlyMine:false,armed:null};

/* ---------- Rechte: bearbeiten nur Ersteller oder freigegebene Planer, löschen nur Ersteller ---------- */
const canEdit=s=>!!S.user&&(s.owner===S.user.id||(s.editors||[]).includes(S.user.id));
const canDelete=s=>!!S.user&&s.owner===S.user.id;

/* ---------- PLZ-Verzeichnis ---------- */
const PLZ={ready:false};
fetch('plz.json').then(r=>r.json()).then(d=>{
  for(const land of Object.keys(d)){
    const byZip=new Map(),byOrt=new Map();
    d[land].forEach(([z,o,k])=>{
      if(!byZip.has(z))byZip.set(z,[]);byZip.get(z).push({o,k:k||''});
      const key=o.toLowerCase();if(!byOrt.has(key))byOrt.set(key,{o,list:[]});byOrt.get(key).list.push({z,k:k||''});
    });
    PLZ[land]={byZip,byOrt,orte:[...byOrt.values()].map(x=>x.o).sort((a,b)=>a.localeCompare(b,'de'))};
  }
  PLZ.ready=true;
}).catch(()=>{});

/* ---------- Passwort ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
    return 'p2$'+hex(bits);
  }
  let h=2166136261;const s=salt+pw;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'f1$'+(h>>>0).toString(16);
}
async function setPw(o,pw){o.salt=nid()+nid();o.hash=await hashPw(pw,o.salt)}
async function checkPw(o,pw){return o&&o.hash&&(await hashPw(pw,o.salt))===o.hash}

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(list,val)=>list.map(([k,l])=>`<option value="${esc(k)}"${k===val?' selected':''}>${esc(l)}</option>`).join('');
const msgHTML=()=>S.msg?`<div class="msg ${S.msg.t}" role="status">${esc(S.msg.m)}</div>`:'';
const sortedUsers=()=>[...D.users].sort((a,b)=>a.name.localeCompare(b.name,'de'));
const userName=id=>(D.users.find(u=>u.id===id)||{}).name||'unbekannt';
const landName=k=>(LAENDER.find(l=>l[0]===k)||[,k])[1];
const kantonName=k=>(KANTONE.find(x=>x[0]===k)||[,''])[1];
const fmtDate=iso=>{try{return new Date(iso).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
const fmtTime=d=>d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
const complete=s=>!!(s.kom&&s.adr&&s.plz&&s.ort&&(s.land!=='CH'||s.kanton));
const nrm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');
const cpt=x=>nrm(x).replace(/[\s\-\/.,_]/g,'');
function matches(hayParts,query){const words=nrm(query).split(/\s+/).filter(Boolean);if(!words.length)return true;const hay=nrm(hayParts.join(' ')),hayC=cpt(hay);return words.every(w=>hay.includes(w)||hayC.includes(cpt(w)))}
const fillDl=(id,vals)=>{$('#'+id).innerHTML=vals.map(v=>`<option value="${esc(v)}"></option>`).join('')};
const LV={start:0,adminLogin:0,admin:0,liste:0,baustelle:1,plan:2,schema:3};
function go(screen,msg){
  const cur=LV[S.screen]||0,nx=LV[screen]||0;
  if(nx<cur&&S.pushDepth>0&&history.state&&history.state.prev===screen){S.pushDepth--;S.pendingMsg=msg||null;try{history.back();return}catch(e){}}
  const push=nx>cur,prev=S.screen;
  S.screen=screen;S.msg=msg||null;S.armed=null;render();

function drawPattern(){
  const svg=$('#pattern');const w=1400,h=520;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  const ph=['#ffed00','#c9c9c0','#b3b3aa','#ffed00'];const c='#b9b9b0';
  let s='';
  [40,66,92,118].forEach((y,i)=>s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${ph[i]}" stroke-width="3" opacity=".9"/>`);
  for(let i=0;i<26;i++){
    const x=60+i*54,bus=40+(i%4)*26,y0=180+(i%3)*14;
    s+=`<g stroke="${c}" stroke-width="1.3" opacity=".55"><line x1="${x}" y1="${bus}" x2="${x}" y2="${y0}"/><line x1="${x}" y1="${y0+34}" x2="${x-11}" y2="${y0+8}"/><line x1="${x-4}" y1="${y0-4}" x2="${x+4}" y2="${y0+4}"/><line x1="${x-4}" y1="${y0+4}" x2="${x+4}" y2="${y0-4}"/><line x1="${x}" y1="${y0+34}" x2="${x}" y2="${h}" opacity=".6"/></g><circle cx="${x}" cy="${bus}" r="3" fill="${c}" opacity=".4"/>`;
  }
  s+=`<defs><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".97"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="${w}" height="${h}" fill="url(#fade)"/>`;
  svg.innerHTML=s;
}

function persistSite(){
  const p=S.site;if(!p||!canEdit(p))return false;
  p.updated=now();

  if(i>=0&&!canEdit(D.sites[i]))return false;
  if(i<0)D.sites.push(JSON.parse(JSON.stringify(p)));else D.sites[i]=JSON.parse(JSON.stringify(p));
  S.isNew=false;saveSession();
  const el=$('#savedInfo');
  if(save()){S.savedAt=new Date();if(el)el.textContent='Gespeichert um '+fmtTime(S.savedAt);return true}
  if(el)el.textContent='Speichern fehlgeschlagen, der Gerätespeicher ist voll oder gesperrt';return false;
}
let persistT=null;const persistSoon=()=>{clearTimeout(persistT);persistT=setTimeout(()=>{persistT=null;persistSite()},400)};
function validate(p){
  const miss=[];
  if(!p.kom.trim())miss.push('Kommissionsnummer');
  if(!p.adr.trim())miss.push('Strasse');
  if(!p.plz.trim())miss.push('PLZ');
  if(!p.ort.trim())miss.push(p.land==='DE'?'Stadt':'Ort');
  if(p.land==='CH'&&!p.kanton)miss.push('Kanton');
  if(miss.length)return 'Gespeichert als angefangene Baustelle. Es fehlt noch: '+miss.join(', ')+'.';
  const len={CH:4,LI:4,AT:4,DE:5,FR:5}[p.land];
  if(len&&!new RegExp('^\\d{'+len+'}$').test(p.plz.trim()))return `Gespeichert. Bitte die PLZ prüfen, in ${landName(p.land)} hat sie ${len} Ziffern.`;
  return null;
}
function setField(k,v){S.site[k]=v;const el=$('#b-'+k);if(el)el.value=v}
function onPlz(){
  const p=S.site,L=PLZ[p.land];if(!L)return;
  const z=p.plz.trim();
  /* Vorschläge erst ab 3 Ziffern und nur wenige, damit man frei weitertippen kann */
  const zips=z.length>=3?[...L.byZip.keys()].filter(k=>k.startsWith(z)&&k!==z).slice(0,8):[];
  fillDl('dlPlz',zips);
  const hit=L.byZip.get(z);
  if(hit){
    fillDl('dlOrt',[...new Set(hit.map(h=>h.o))]);
    if(!p.ort||p._autoOrt===p.ort||!hit.some(h=>h.o===p.ort)){setField('ort',hit[0].o);p._autoOrt=hit[0].o}
    if(p.land==='CH'&&hit[0].k){setField('kanton',hit[0].k)}
  }
}
function onOrtTyping(){
  const p=S.site,L=PLZ[p.land];if(!L)return;
  const o=p.ort.trim().toLowerCase();
  fillDl('dlOrt',o.length<2?[]:L.orte.filter(x=>x.toLowerCase().startsWith(o)).slice(0,30));
}
function onOrtDone(){
  const p=S.site,L=PLZ[p.land];if(!L)return;
  const hit=L.byOrt.get(p.ort.trim().toLowerCase());if(!hit)return;
  if(p.ort!==hit.o)setField('ort',hit.o);
  const zips=[...new Set(hit.list.map(h=>h.z))];
  fillDl('dlPlz',zips);
  if(!zips.includes(p.plz.trim())){setField('plz',zips.length===1?zips[0]:'');}
  if(p.land==='CH'&&hit.list[0].k)setField('kanton',hit.list[0].k);
  if(zips.length>1&&!p.plz){S.msg={t:'info',m:hit.o+' hat mehrere Postleitzahlen. Tippe ins PLZ-Feld und wähle die passende.'};$('#bMsg').innerHTML=msgHTML()}
}
function printSheet(){

  if((t.dataset.zl==='name'||t.dataset.zl==='ziel')&&S.site&&canEdit(S.site)){const z=zlOfEl(t);if(z){z[t.dataset.zl]=t.value;planOf(S.site).changed=now();refreshPreview();persistSoon()}}
  if(t.id==='q'){S.q=t.value;$('#siteList').innerHTML=siteListHTML()}
  if(t.id==='fOrt'){S.fOrt=t.value;$('#siteList').innerHTML=siteListHTML()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='userSel'){S.sel=t.value;S.msg=null;render();return}
  if(t.dataset.b&&S.site&&canEdit(S.site)){
    S.site[t.dataset.b]=t.value;
    if(t.dataset.b==='land'){if(t.value!=='CH')S.site.kanton='';persistSite();render();return}
    if(t.dataset.b==='ort')onOrtDone();
    persistSite();return}
  if(t.dataset.doc&&S.site&&canEdit(S.site)){const pl=planOf(S.site);pl.docs[t.dataset.doc]=t.checked;S.prevSel=null;touchPlan('Unterlagen angepasst');render();return}
  if(t.dataset.zsel){S.zlSel=+t.value;S.prevSel=null;render();return}
  if(t.dataset.sk&&S.site&&canEdit(S.site)){skSet(t);touchPlan('Stromkreise angepasst');const r=planOf(S.site).sk[+t.closest('.sk').dataset.i];if(t.dataset.sk==='abg'||(r&&(r.relais||[]).length&&(t.dataset.sk==='adern'||t.dataset.sk==='qs')))render();return}
  if(t.dataset.kab&&S.site&&canEdit(S.site)){const r=planOf(S.site).sk[+t.closest('.sk').dataset.i];if(!r)return;const q=+t.dataset.kab;r.kab=r.kab||[];r.kab[q]=r.kab[q]||{adern:r.adern,qs:r.qs};r.kab[q][t.dataset.f]=t.value;touchPlan('Kabel Abgang '+(q+1)+' bei '+(r.name||'Stromkreis'));render();return}
  if(t.dataset.zl&&S.site&&canEdit(S.site)){const z=zlOfEl(t),k=t.dataset.zl,pl=planOf(S.site);if(!z)return;const nm='-P'+(pl.zl.indexOf(z)+1);
    if(k==='name'||k==='ziel'){touchPlan('Zähler '+nm+' angepasst');return}
    if(k==='res'){if(pl.zl.indexOf(z)===0){t.checked=false;return}z.res=t.checked;touchPlan('Zähler '+nm+(z.res?' als Reserveplatz':' wieder mit Zähler'))}
    else{z[k]=t.value;if(k==='bez'&&!(BEZ_A[z.bez]||[]).includes(z.bezA))z.bezA='';touchPlan('Zähler '+nm+': '+(k==='bez'||k==='bezA'?'Bezügersicherung '+bezTxt(z):'Abgang '+(z.adern==='3'?'3×':'5×')+(z.qs?qsTxt(z.qs)+' mm²':'')))}
    S.prevSel=null;render();return}
  if(t.dataset.rladd!=null&&t.value&&S.site&&canEdit(S.site)){const pl=planOf(S.site),r=pl.sk[+t.dataset.rladd];if(r){r.relais=r.relais||[];r.relais.push(t.value);touchPlan('Relais '+relInfo(t.value)[1]+' bei '+(r.name||'Stromkreis'));render()}return}
  if((t.dataset.ex==='res'||t.dataset.ex==='resPct'||t.dataset.ex==='relSame')&&S.site&&canEdit(S.site)){const pl=planOf(S.site),k=t.dataset.ex;
    if(k==='res')pl.resOff=!t.checked;if(k==='relSame')pl.relSame=t.checked;if(k==='resPct')pl.resPct=Math.max(10,Math.round(+t.value||10));
    touchPlan(k==='relSame'?'Relais '+(t.checked?'auf Sicherungsschienen':'auf eigene Schiene'):'Reserve '+(pl.resOff?'abgewählt':(pl.resPct||10)+' %'));render();return}
  if(t.dataset.ex==='hsA'&&S.site&&canEdit(S.site)){const pl=planOf(S.site);pl.hsA=t.value;touchPlan('Hauptschalter '+(t.value?t.value+' A':''));render();return}
  if((t.dataset.ex==='spd'||t.dataset.ex==='hs')&&S.site&&canEdit(S.site)&&S.site.art!=='HV'){const pl=planOf(S.site);pl[t.dataset.ex]=t.checked;S.prevSel={step:pl.step,idx:pagesOf(S.site).findIndex(q=>q.kind==='einspeisung')};touchPlan((t.dataset.ex==='spd'?'Überspannungsschutz':'Hauptschalter')+(t.checked?' ergänzt':' entfernt'));render();return}
  if(t.dataset.ex==='siem'&&S.site&&canEdit(S.site)){const pl=planOf(S.site);pl.siem=t.checked;pl.siemOk=null;touchPlan(t.checked?'Extras: Siemens FI/LS gewählt':'Extras: Siemens FI/LS entfernt');render();return}
  if(t.dataset.pl&&S.site&&canEdit(S.site)){
    const pl=planOf(S.site),k=t.dataset.pl;
    if(k==='herstellerFrei'){const v=t.value.trim();if(v){pl.hersteller=v;touchPlan('Hersteller '+v)}render();return}
    if(k==='material'){pl.material=t.checked;touchPlan('Materialliste '+(t.checked?'ja':'nein'));return}
    if(k==='nb'){pl.nb=t.value.trim();if(S.site.plz){D.nbMap=D.nbMap||{};D.nbMap[S.site.land+':'+S.site.plz.trim()]=pl.nb}touchPlan('Netzbetreiber '+pl.nb);return}
    pl[k]=t.value;
    if(k==='bez'){if(!(BEZ_A[pl.bez]||[]).includes(pl.bezA))pl.bezA='';touchPlan('Bezügersicherung '+bezTxt(pl))}
    if(k==='bezA')touchPlan('Bezügersicherung '+bezTxt(pl));
    if(k==='qs'||k==='adern')touchPlan('Zuleitung '+((pl.adern||'5')==='5'?'5×':'3×')+(pl.qs?qsTxt(pl.qs)+' mm²':''));
    render();return}
  if(t.dataset.share&&S.site&&S.site.owner===S.user.id){
    const set=new Set(S.site.editors||[]);t.checked?set.add(t.dataset.share):set.delete(t.dataset.share);S.site.editors=[...set];persistSite();return}
  if(t.id==='fNorm'){S.fNorm=t.value;$('#siteList').innerHTML=siteListHTML();return}
  if(t.id==='fKanton'){S.fKanton=t.value;$('#siteList').innerHTML=siteListHTML();return}
  if(t.id==='onlyMine'){S.onlyMine=t.checked;$('#siteList').innerHTML=siteListHTML();return}
  if(t.id==='importFile'){
    const file=t.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{try{
        const o=JSON.parse(r.result);if(!Array.isArray(o.sites))throw 0;
        let n=0,skip=0;
        o.sites.forEach(s=>{if(!s||!s.id)return;
          const nm=(o.users||[]).find(u=>u.id===s.owner);
          if(!D.users.some(u=>u.id===s.owner)){const ex=nm&&D.users.find(u=>u.name===nm.name);if(ex)s.owner=ex.id;else if(nm){const nu={id:s.owner,name:nm.name};D.users.push(nu)}}
          s.editors=Array.isArray(s.editors)?s.editors:[];
          const i=D.sites.findIndex(x=>x.id===s.id);
          if(i<0){D.sites.push(s);n++}
          else if((s.updated||'')>(D.sites[i].updated||'')){if(canEdit(D.sites[i])){D.sites[i]=s;n++}else skip++}});
        save();S.msg={t:'ok',m:n+' Baustellen übernommen.'+(skip?' '+skip+' fremde Baustellen wurden nicht überschrieben.':'')};
      }catch(err){S.msg={t:'err',m:'Diese Datei ist keine Sicherung der Verteilerplanung.'}}
      t.value='';render()};
    r.readAsText(file);
  }
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='loginForm'){
    const u=D.users.find(x=>x.id===S.sel);
    if(!u){S.msg={t:'err',m:'Bitte zuerst einen Namen wählen.'};return render()}
    if(!u.hash){
      const a=$('#pw1').value,b=$('#pw2').value;
      if(a.length<6){S.msg={t:'err',m:'Das Passwort braucht mindestens 6 Zeichen.'};return render()}
      if(a!==b){S.msg={t:'err',m:'Die beiden Passwörter stimmen nicht überein.'};return render()}
      await setPw(u,a);save();
    }else if(!(await checkPw(u,$('#pw').value))){S.msg={t:'err',m:'Das Passwort stimmt nicht. Bitte nochmals versuchen.'};return render()}
    S.user=u;S.admin=false;return go('liste');
  }
  if(id==='bForm'){
    if(!canEdit(S.site))return go('liste');
    persistSite();const w=validate(S.site);
    return go('liste',w?{t:'err',m:w}:{t:'ok',m:'Baustelle '+S.site.kom+' gespeichert.'});
  }
  if(id==='adminForm'){
    const a=$('#apw').value;
    if(!D.admin){
      if(a.length<8){S.msg={t:'err',m:'Das Verwaltungspasswort braucht mindestens 8 Zeichen.'};return render()}
      if(a!==$('#apw2').value){S.msg={t:'err',m:'Die beiden Passwörter stimmen nicht überein.'};return render()}
      D.admin={};await setPw(D.admin,a);save();
    }else if(!(await checkPw(D.admin,a))){S.msg={t:'err',m:'Das Verwaltungspasswort stimmt nicht.'};return render()}
    S.admin=true;S.user=null;return go('admin');
  }
  if(id==='addUser'){
    const n=$('#newName').value.trim().replace(/\s+/g,' ');
    if(n.length<3){S.msg={t:'err',m:'Bitte Vor- und Nachnamen eingeben.'};return render()}
    if(D.users.some(u=>u.name.toLowerCase()===n.toLowerCase())){S.msg={t:'err',m:n+' gibt es schon.'};return render()}
    D.users.push({id:nid(),name:n});save();S.msg={t:'ok',m:n+' angelegt. Beim ersten Anmelden legt die Person ihr Passwort selbst fest.'};return render();
  }
  if(id==='chAdmin'){
    const a=$('#newApw').value;if(a.length<8){S.msg={t:'err',m:'Das neue Verwaltungspasswort braucht mindestens 8 Zeichen.'};return render()}
    await setPw(D.admin,a);save();S.msg={t:'ok',m:'Verwaltungspasswort geändert.'};return render();
  }
});

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const act=t.dataset.act;
  if(t.dataset.seg&&S.site&&canEdit(S.site)){S.site[t.dataset.seg]=t.dataset.v;persistSite();
    t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));if(t.dataset.seg==='art'){const g=$('#gebBox');if(g)g.hidden=t.dataset.v!=='HV'}return}
  if(act==='saveSite'){persistSite();const w=validate(S.site);S.msg=w?{t:'err',m:w}:{t:'ok',m:'Gespeichert.'};$('#bMsg').innerHTML=msgHTML();return}
  if(act==='print'){printSheet();return}
  if(act==='toPlan'){if(canEdit(S.site))persistSite();planOf(S.site);return go('plan')}
  if(act==='toSite'){return go('baustelle')}
  if(act==='planNext'){const pl=planOf(S.site),i=stepIdx(pl.step);if(!stepOk(pl,pl.step))return;if(canEdit(S.site)){if(pl.step==='zuleitung'&&S.site.art==='HV'&&pl.nb&&S.site.plz){D.nbMap=D.nbMap||{};D.nbMap[S.site.land+':'+S.site.plz.trim()]=pl.nb}}pl.step=stepNext(S.site,pl.step);if(pl.step==='zaehler'&&S.site.geb==='MFH'&&pl.zl.length<2&&canEdit(S.site))pl.zl.push(zlNew(S.site));if(canEdit(S.site))persistSite();render();window.scrollTo(0,0);return}
  if(act==='planPrev'){const pl=planOf(S.site),pv=stepPrev(S.site,pl.step);if(!pv)return go('baustelle');pl.step=pv;if(canEdit(S.site))persistSite();render();window.scrollTo(0,0);return}
  if(t.dataset.step){const pl=planOf(S.site);pl.step=t.dataset.step;if(canEdit(S.site))persistSite();render();window.scrollTo(0,0);return}
  if(t.dataset.plv&&S.site&&canEdit(S.site)){const pl=planOf(S.site),k=t.dataset.plv;pl[k]=t.dataset.v;if(k==='montage'&&t.dataset.v==='UP')pl.gehaeuse='hersteller';touchPlan({hersteller:'Hersteller ',gehaeuse:'Gehäuse ',montage:'Montage '}[k]+(k==='gehaeuse'?(t.dataset.v==='alu'?'Alu':'Hersteller'):t.dataset.v));render();return}
  if(t.dataset.page){S.pageIdx=+t.dataset.page;render();return}
  if(t.dataset.pv){S.prevSel={step:planOf(S.site).step,idx:+t.dataset.pv};refreshPreview();return}
  if(act==='skAdd'&&S.site&&canEdit(S.site)){skAddRow();return}
  if((act==='zlAdd'||act==='zlRes')&&S.site&&canEdit(S.site)){const pl=planOf(S.site),z=zlNew(S.site,act==='zlRes');pl.zl.push(z);pl.step='zaehler';S.prevSel=null;touchPlan((z.res?'Reservezählerplatz':'Zähler')+' -P'+pl.zl.length+' ergänzt');render();const ins=document.querySelectorAll('input[data-zl="name"]');const l=ins[ins.length-1];if(l){l.focus();l.scrollIntoView({block:'nearest'})}return}
  if(t.dataset.zldel&&S.site&&canEdit(S.site)){const pl=planOf(S.site),j=+t.dataset.zldel,z=pl.zl[j];if(!z||j===0)return;pl.zl.splice(j,1);pl.sk.forEach(r=>{if(String(r.zl)===String(z.id))r.zl=''});S.prevSel=null;touchPlan('Zähler -P'+(j+1)+' entfernt');render();return}
  if(t.dataset.relauto&&S.site&&canEdit(S.site)){const r=planOf(S.site).sk[+t.dataset.relauto];if(r){r.relMan=false;r.abg='1';r.kab=[];touchPlan('Relaiskabel wieder automatisch bei '+(r.name||'Stromkreis'));render()}return}
  if(t.dataset.rldel&&S.site&&canEdit(S.site)){const [j,q]=t.dataset.rldel.split(':').map(Number),pl=planOf(S.site),r=pl.sk[j];if(r&&r.relais){r.relais.splice(q,1);touchPlan('Relais entfernt bei '+(r.name||'Stromkreis'));render()}return}
  if(act==='siemAck'&&S.site&&canEdit(S.site)){const pl=planOf(S.site);pl.siemOk={gez:S.user.name,date:new Date().toLocaleDateString('de-CH')};S.prevSel=null;touchPlan('Siemens FI/LS quittiert');render();return}
  if(t.dataset.skdel&&S.site&&canEdit(S.site)){const pl=planOf(S.site),r=pl.sk[+t.dataset.skdel];pl.sk.splice(+t.dataset.skdel,1);touchPlan('Stromkreis '+((r&&r.name)||'')+' entfernt');render();return}
  if(act==='saveNow'){if(S.site&&canEdit(S.site)){persistSite();t.textContent='Gespeichert ✓';setTimeout(()=>{if(t.isConnected)t.textContent='Speichern'},1800)}return}
  if(act==='schema'){if(t.dataset.pi!=null)S.pageIdx=+t.dataset.pi;return go('schema')}
  if(act==='backToPlan'){return go('plan')}
  if(act==='printSchema'){
    $('#printSheet').innerHTML=pagesOf(S.site).map(pg=>schemaSVG(S.site,pg,{print:true})).join('');document.body.classList.add('ps');
    const st=document.createElement('style');st.id='pgA3';st.textContent='@page{size:A3 landscape;margin:6mm}';document.head.appendChild(st);
    window.print();setTimeout(()=>{document.body.classList.remove('ps');st.remove()},500);return}
  if(act==='new'){S.site={id:nid(),owner:S.user.id,editors:[],kom:'',bereich:'',stock:'',bauherr:'',adr:'',plz:'',ort:'',kanton:'',land:'CH',norm:'NIN',art:'UV',geb:'EFH',created:now(),updated:now()};S.isNew=true;S.savedAt=null;return go('baustelle')}
  if(t.dataset.open){
    if(t.dataset.fromhint&&S.site){const cur=S.site;const onlyKom=!cur.bauherr&&!cur.adr&&!cur.plz&&!cur.ort;if(onlyKom&&cur.owner===S.user.id){clearTimeout(persistT);D.sites=D.sites.filter(s=>s.id!==cur.id);save()}}
    const s=D.sites.find(x=>x.id===t.dataset.open);if(!s)return;
    S.site=JSON.parse(JSON.stringify(s));S.isNew=false;S.savedAt=null;return go('baustelle')}
  if(t.dataset.arm){S.armed=t.dataset.arm;S.msg=null;if(S.screen==='liste'){$('#siteList').innerHTML=siteListHTML()}else render();return}
  if(act==='disarm'){S.armed=null;$('#siteList').innerHTML=siteListHTML();return}
  if(t.dataset.delsite){const s=D.sites.find(x=>x.id===t.dataset.delsite);if(!s||!canDelete(s))return;D.sites=D.sites.filter(x=>x.id!==s.id);save();S.armed=null;return go('liste',{t:'ok',m:'Baustelle '+(s.kom||'')+' gelöscht.'})}
  if(act==='liste'||act==='back'){if(SITE_SCR.includes(S.screen)&&S.site&&!S.isNew)persistSite();const up={schema:'plan',plan:'baustelle'};return go(act==='back'&&up[S.screen]?up[S.screen]:'liste')}
  if(act==='logout'){if(S.screen==='baustelle'&&S.site&&!S.isNew)persistSite();S.user=null;S.sel='';S.site=null;return go('start')}
  if(act==='adminLogin')return go('adminLogin');
  if(act==='adminOut'){S.admin=false;return go('start')}
  if(act==='home')return go('start');
  if(act==='export'){
    const data={app:'verteilerplanung',version:3,exported:now(),users:D.users.map(u=>({id:u.id,name:u.name})),sites:D.sites};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Verteilerplanung-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return}
  if(act==='import'){$('#importFile').click();return}
  if(t.dataset.reset){const u=D.users.find(x=>x.id===t.dataset.reset);delete u.hash;delete u.salt;save();S.armed=null;S.msg={t:'ok',m:'Passwort von '+u.name+' zurückgesetzt. Beim nächsten Anmelden wird ein neues festgelegt.'};return render()}
  if(t.dataset.del){const u=D.users.find(x=>x.id===t.dataset.del);D.users=D.users.filter(x=>x.id!==u.id);save();S.armed=null;S.msg={t:'ok',m:u.name+' entfernt. Die Baustellen bleiben erhalten.'};return render()}
});

const zlOfEl=t=>{const el=t.closest('[data-zi]');return el?planOf(S.site).zl[+el.dataset.zi]:null};
function skSet(t){const pl=planOf(S.site),row=t.closest('.sk'),r=pl.sk[+row.dataset.i];if(!r)return;const k=t.dataset.sk;if(k!=='relSame'){if(r[k]===t.value)return;
    const nr=(r.relais||[]).length;if(nr&&!r.relMan&&(k==='adern'||k==='qs'||(k==='abg'&&+t.value>1))){r.relMan=true;r.adern=String(relCab(nr));r.qs='1.5'}
    r[k]=t.value}
  if(k==='relSame'){r.relSame=t.checked;pl.changed=now();refreshPreview();return}
  if(k==='adern'||k==='qs')r.kabAuto=false;
  if((k==='pol'||k==='amp')&&r.kabAuto!==false){autoKab(r);const a=row.querySelector('[data-sk=adern]'),q=row.querySelector('[data-sk=qs]');if(a)a.value=r.adern;if(q)q.value=r.qs}
  pl.changed=now();refreshPreview()}
function skAddRow(){const pl=planOf(S.site);pl.sk.push(skNew(S.site));persistSite();render();const ins=document.querySelectorAll('#skRows input[data-sk="name"]');const l=ins[ins.length-1];if(l){l.focus();l.scrollIntoView({block:'nearest'})}}
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.sk&&S.site&&canEdit(S.site)){e.preventDefault();const pl=planOf(S.site),i=+t.closest('.sk').dataset.i,ins=[...document.querySelectorAll('#skRows input[data-sk="name"]')],pos=ins.findIndex(x=>+x.closest('.sk').dataset.i===i);if(pos===ins.length-1){if(!(pl.sk[i].name||'').trim())return;touchPlan('Stromkreis '+pl.sk[i].name);skAddRow()}else if(ins[pos+1])ins[pos+1].focus()}});
drawPattern();
const y0=restoreSession();S.pushDepth=history.state&&history.state.screen===S.screen?(LV[S.screen]||0):0;render();try{history.replaceState({...navState(),prev:(history.state&&history.state.screen===S.screen&&history.state.prev)||null},'','#'+S.screen)}catch(e){}
if(y0)setTimeout(()=>window.scrollTo(0,y0),50);
})();
</script>
