<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: helle Seite, Logozeile, weisses Band mit Schaltschema-Motiv und gelber Linie, darunter Karten. Gelb als Akzent nach Schachenmann. */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --ink:#141414; --muted:#5f5f5a; --line:#dcdcd5; --field:#ffffff;
  --head:#ffffff; --accent:#ffed00; --accent-ink:#111111; --link:#5c5200; --focus:#111111;
  --err:#b42318; --err-soft:#fdecea; --ok:#1d7a46; --ok-soft:#e3f3e9; --info-soft:#fff9c2; --info:#4a4300;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#ffffff;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrapx{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Logozeile: immer weiss, damit das Originallogo stimmt */
.brandbar{background:#ffffff;color:#141414;padding-top:env(safe-area-inset-top,0px)}
.brandbar .wrapx{padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lg{display:flex;flex-direction:column;gap:5px}
.lg img{height:36px;width:auto;max-width:100%;display:block}
.start .lg img{height:clamp(44px,10vw,64px)}
.tagline{font-size:12px;color:#6b6b64;letter-spacing:.05em}
.wordmark{font:800 italic 30px/1 var(--f-display);color:#111}
.bk img{height:30px;width:auto;display:block}

/* Schwarzes Band */
.hero{position:relative;background:var(--head);color:var(--ink);overflow:hidden;border-top:1px solid #ecece6}
.hero svg.pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero .yb{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--accent)}
.hero .wrapx{position:relative;padding-block:26px 112px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.start .hero .wrapx{padding-block:30px 120px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.topbar .who{opacity:.85;margin-right:4px}
.topbar .btn{background:#fff;border-color:var(--line);color:var(--ink)}
.topbar .btn:hover{border-color:var(--ink)}
.pagehead h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em;color:var(--ink)}

/* Inhalt */
.main{margin-top:-90px;padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));position:relative;display:flex;flex-direction:column;gap:20px}
.start .main{margin-top:-104px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:4px;padding:24px;box-shadow:0 14px 34px -22px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:18px;min-width:0}
.card.narrow{max-width:440px;width:100%}
.card h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:14px}
.muted{color:var(--muted);font-weight:500}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;position:relative}
label.f .hint{font-weight:400;color:var(--muted)}
input,select{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--ink)}
input:disabled::placeholder{color:transparent}
input:disabled,select:disabled{opacity:1;background:var(--bg);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#111;color:var(--accent);border-color:#111}
.btn.small{padding:7px 11px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--link);font-weight:600}
.btn.danger{color:var(--err)}
.exd{border:1px solid var(--line);border-radius:4px;margin:10px 0;background:var(--surface)}.exd>summary{cursor:pointer;padding:10px 12px;font-weight:700;list-style-position:inside}.exd[open]>summary{border-bottom:1px solid var(--line)}.exd-b{padding:4px 12px 10px}
.msg{border-radius:4px;padding:10px 12px;font-size:14px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--info-soft);color:var(--info)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:640px){.c4,.c3,.c2{grid-column:span 6}.card{padding:18px}}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;padding:3px;gap:3px;background:var(--bg)}
.seg button{flex:1;border:0;background:none;border-radius:3px;padding:9px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}
.seg button:disabled{cursor:default}
.seg button b{font:700 15px var(--f-display)}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#111}
.seg button[aria-pressed="true"] span{color:#3a3a00}
.legend{font-size:13px;font-weight:600;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.y{background:var(--accent);color:#111;border-color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.lock{background:transparent}
.actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:0 -24px -24px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:2}
@media (max-width:640px){.actions{margin:0 -18px -18px;padding-left:18px;padding-right:18px}}
.saved{font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.foot .btn.link{color:var(--muted);font-size:12px;font-weight:500}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.chk input{width:18px;height:18px;padding:0}
.share{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

/* Übersicht */
.tools{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tools{grid-template-columns:1fr 1fr}.tools .q{grid-column:span 2}}
.sites{display:flex;flex-direction:column}
.site{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.site:last-child{border-bottom:0}
.site .t{font:700 16px var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.site .d{color:var(--muted);font-size:14px}
.site .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.site .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.site{grid-template-columns:1fr}.site .acts{justify-content:flex-start}}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.ulist{display:flex;flex-direction:column}
.uitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.uitem:last-child{border-bottom:0}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 0 4px}
.st{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.st b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);font-size:11px}
.st.on{border-color:#111}.st.on b{background:var(--accent);color:#111}
.st.done b{background:#111;color:var(--accent)}
.st:disabled{opacity:.45;cursor:default}
.b2wrap{border:1px solid var(--line);border-radius:4px;padding:6px;background:#fff;margin:6px 0}.b2d{display:block;max-width:640px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tiles.two-col{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile b{font:700 15px var(--f-display)}.tile span{font-size:12px;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#111}.tile[aria-pressed="true"] span{color:#3a3a00}
.tile:disabled{cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:#111;color:var(--accent);border-color:#111}
#printSheet svg{page-break-after:always;break-after:page}
.plangrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.plangrid{grid-template-columns:minmax(0,1fr)}}
.sk{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.vtg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:6px 0}
.vtc{display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid var(--line);border-radius:6px;padding:8px;background:var(--surface);font:inherit;font-size:13px;cursor:pointer}
.vtc[aria-pressed=true]{border-color:#111;background:var(--info-soft)}.vtc img{width:100%;height:120px;object-fit:contain;background:#f4f4f1;border-radius:4px}
.vtc .vtn{height:120px;display:flex;align-items:center;justify-content:center;background:#f4f4f1;color:var(--muted);border-radius:4px}.vtc span{color:var(--muted)}
.enr{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:16px;font-weight:700;letter-spacing:.5px;user-select:all}
.te.ml th{text-align:left;font-size:12px;color:var(--muted);padding:4px}
.docov{position:fixed;inset:0;z-index:100;background:rgba(20,20,20,.85);display:flex;flex-direction:column}.docbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#fff}
.docpg{overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}.docpg img{max-width:min(100%,1000px);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.lxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0 12px}
.lxc{display:flex;flex-direction:column;gap:3px;border:2px solid var(--line);border-radius:6px;padding:8px;background:var(--surface);font-size:13px}.lxc.on{border-color:#111;background:var(--info-soft)}
.pk{margin:4px 0;flex:1 1 100%;max-width:640px}.pkb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;cursor:pointer;font:inherit;color:inherit}.pkb img,.pkb .ph{width:48px;height:48px;object-fit:contain;flex:none}.pkb span.t{flex:1;display:flex;flex-direction:column}.pkb small,.pkc small{color:var(--muted);font-size:12px}
.pkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-top:6px}.pkc{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid var(--line);border-radius:10px;background:#fff;padding:8px;cursor:pointer;font:inherit;color:inherit}.pkc img,.pkc .ph{width:100%;height:72px;object-fit:contain}.pkc.on{border-color:#111;background:var(--info-soft)}
.sprow{padding:8px 0;border-top:1px solid var(--line)}.sprow1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.sprn{display:flex;align-items:center;gap:6px;white-space:nowrap}.sprn input{width:72px}
.sptyp{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:13px;color:inherit;text-align:left;cursor:pointer}.sptyp img{width:28px;height:28px;object-fit:contain;flex:none}.sptyp span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sptyp small{color:var(--muted)}.sptyp b{font-size:12px;color:var(--muted);font-weight:600}
.rfr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}.rfr small,.rfh small,.rfk small{color:var(--muted);font-size:12px}.rfb{display:flex;gap:4px;flex-wrap:wrap}
.chp{min-width:38px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:14px;color:inherit;cursor:pointer}.chp.sm{min-width:0;padding:3px 7px;font-size:12px}.chp.on{background:var(--accent);border-color:#111;font-weight:700}.chp:disabled{cursor:default;opacity:.6}
.rfc{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}.rfh{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}.rft{width:100%;border-collapse:collapse;font-size:13px}.rft th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:2px 4px}.rft td{padding:4px;border-top:1px solid var(--line);vertical-align:top}.rft td:nth-child(3){white-space:nowrap}.rft td:nth-child(4) small{display:block;margin-top:2px}.rft .rfb{flex-wrap:nowrap}
.rfk{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}.rfkh{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.missHl{outline:3px solid #d0021b !important;outline-offset:4px;border-radius:8px;animation:missP 1s ease 2}@keyframes missP{50%{outline-color:#ff8a8a}}
.missTag{display:inline-block;margin:8px 0 6px;padding:6px 10px;border-radius:6px;background:#d0021b;color:#fff;font-weight:700;font-size:14px}
.missRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.ph{display:flex;align-items:center;justify-content:center;background:#f4f4f1;color:var(--muted);border-radius:6px;font-size:11px;text-align:center}
.lxc.soft{opacity:.5}.lxc img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:4px}.lxc .vtn{height:120px;display:flex;align-items:center;justify-content:center;background:#f4f4f1;color:var(--muted);border-radius:4px}.lxc span{color:var(--muted)}
.mlx{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}.mlx>.ml{min-width:680px}.ml td,.ml th{padding-right:12px}.ml td:nth-child(1),.ml td:nth-child(2),.ml td:nth-child(4){white-space:nowrap}.ml td:nth-child(3){min-width:220px}
@media print{.mlx{overflow:visible}.mlx>.ml{min-width:0}}
.pform{border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:6px;background:var(--bg)}
.skro .sk{opacity:.6;background:var(--bg);padding:10px 8px}.skro .sk input,.skro .sk select{cursor:not-allowed}
.sk1{display:flex;gap:8px;align-items:center}.sk1 input{flex:1;padding:9px 10px}
.sk2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sk .m{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.sk select{padding:8px 2px 8px 6px;font-size:14px;color:var(--ink)}
.sk .x{padding:8px 0;width:40px;color:var(--muted);flex:none}
.skt{flex:none}
.zlr{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;border-bottom:1px solid var(--line)}.zlr.res{background:#fafafa;border-style:dashed}.zlno{min-width:40px;font-size:16px}.zlsel{max-width:210px;padding:8px}
.kabq{display:flex;flex-wrap:wrap;gap:8px}.kq{display:inline-flex;gap:6px;align-items:center;font-size:13px}.kq select{width:auto;padding:6px 8px;font-size:13px}
.sk3{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}.sk3 .m select{height:38px;padding:6px 8px;font-size:13px;width:auto;min-width:140px}
.rl{display:inline-flex;align-items:center;gap:6px;background:var(--info-soft);border:1px solid #e6dc6a;border-radius:3px;padding:4px 4px 4px 8px;font-size:13px}
.rl button{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 6px}
.rladd{width:auto;padding:6px 8px;font-size:13px}.chk.small{font-size:13px}.te{border-collapse:collapse;width:100%;font-size:14px}.te td{padding:6px 0;border-bottom:1px solid var(--line)}.te td:last-child{text-align:right;font-weight:600}.te tr.sum td{font-weight:700}.chk input.pct{width:72px;height:auto;padding:6px 8px;font-size:15px}
.chk.off{color:var(--muted);opacity:.6}.chk.small input{width:16px;height:16px}
.sk .note{padding:7px 10px;font-size:14px}.kab{font-size:14px;color:var(--ink);font-weight:500;padding:8px 0}
.skn{display:flex;flex-direction:column;gap:2px;font-size:13px}.skn .nt{color:var(--info)}.skn .warn{color:var(--err);font-weight:600}
.alarm{border:2px solid var(--err);display:flex;flex-direction:column;gap:8px;font-size:15px}.ackd{font-weight:600}
.btn.danger{background:var(--err);color:#fff;border-color:var(--err)}
@media (max-width:640px){.sk2{grid-template-columns:repeat(3,minmax(0,1fr))}.skt{display:none}}
.ptabs{display:flex;gap:4px;flex-wrap:wrap}.ptabs .tab{padding:4px 8px;font-size:12px}
.prevbox{border:1px solid var(--line);padding:0;background:#fff;cursor:zoom-in;display:block;width:100%;border-radius:2px}
.prevbox svg,.schemabox svg{width:100%;height:auto;display:block}
.schemabox{overflow-x:auto;border:1px solid var(--line);background:#fff}
.schemabox svg{min-width:860px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary:disabled:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
body.ps .brandbar{display:none!important}
#printSheet svg{width:100%;height:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}

/* Druckblatt */
#printSheet{display:none}
@media print{
  @page{margin:16mm}
  body{background:#fff;color:#000}
  .hero,.main,.foot,.bk{display:none!important}
  .brandbar{border:0;padding:0}
  #printSheet{display:block;font-size:12pt;color:#000}
  #printSheet h1{font-size:20pt;margin:12pt 0 4pt}
  #printSheet table{border-collapse:collapse;width:100%;margin-top:10pt}
  #printSheet td{border-bottom:1px solid #ccc;padding:6pt 4pt;vertical-align:top}
  #printSheet td:first-child{width:38%;color:#555}
  #printSheet .pf{margin-top:18pt;font-size:9pt;color:#666}
  body.pm #printSheet td:first-child{width:auto;color:#000}body.pm #printSheet .enr{font-size:13pt}body.pm #printSheet h3{font-size:14pt;margin:14pt 0 2pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="brandbar"><div class="wrapx">
  <div class="lg"><div id="logo"><span class="wordmark">Schachenmann</span></div><div class="tagline">Planungssoftware Service und Unterhalt</div></div>
  <div class="bk" id="bk"></div>

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
    return 'p2$'+hex(bits);
  }
  let h=2166136261;const s=salt+pw;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'f1$'+(h>>>0).toString(16);
}
async function setPw(o,pw){o.salt=nid()+nid();o.hash=await hashPw(pw,o.salt)}
async function checkPw(o,pw){return o&&o.hash&&(await hashPw(pw,o.salt))===o.hash}

function matches(hayParts,query){const words=nrm(query).split(/\s+/).filter(Boolean);if(!words.length)return true;const hay=nrm(hayParts.join(' ')),hayC=cpt(hay);return words.every(w=>hay.includes(w)||hayC.includes(cpt(w)))}

  try{if(push){history.pushState({...navState(),prev},'','#'+screen);S.pushDepth=(S.pushDepth||0)+1}else history.replaceState({...navState(),prev:(history.state||{}).prev||null},'','#'+screen)}catch(e){}
  window.scrollTo(0,0)}

const SKEY='vp.session';
function saveSession(){try{
  if(!S.user&&!S.admin){localStorage.removeItem(SKEY);return}
  localStorage.setItem(SKEY,JSON.stringify({u:S.user?S.user.id:null,admin:S.admin,screen:S.screen,site:SITE_SCR.includes(S.screen)?S.site:null,isNew:S.isNew,q:S.q,fNorm:S.fNorm,fKanton:S.fKanton,fOrt:S.fOrt,onlyMine:S.onlyMine,y:window.scrollY}))}catch(e){}}
function restoreSession(){try{
  const o=JSON.parse(localStorage.getItem(SKEY));if(!o)return 0;
  const u=o.u&&D.users.find(x=>x.id===o.u);
  if(SB.on){if(!(u&&SB.sess&&SB.sess.pid===u.id))return 0;S.user=u}
  else if(u&&u.hash)S.user=u;else if(o.admin&&D.admin)S.admin=true;else return 0;
  if(SB.on&&o.admin&&u.admin){S.admin=true;S.screen='admin';return o.y||0}
  S.q=o.q||'';S.fNorm=o.fNorm||'';S.fKanton=o.fKanton||'';S.fOrt=o.fOrt||'';S.onlyMine=!!o.onlyMine;
  if(S.admin){S.screen='admin';return o.y||0}
  S.screen=['liste',...SITE_SCR].includes(o.screen)?o.screen:'liste';
  if(SITE_SCR.includes(S.screen)){
    const ex=o.site&&D.sites.find(x=>x.id===o.site.id);
    if(ex){S.site=JSON.parse(JSON.stringify(ex));S.isNew=false}
    else if(o.site&&o.isNew&&o.site.owner===S.user.id){S.site=o.site;S.isNew=true}
    else S.screen='liste';
  }
  return o.y||0;
}catch(e){return 0}}
function openScreen(st){
  if(!S.user&&!S.admin){S.screen='start';render();return}
  if(S.admin){S.screen='admin';render();return}
  if(st&&SITE_SCR.includes(st.screen)&&st.siteId){const ex=D.sites.find(x=>x.id===st.siteId);
    if(ex){S.site=JSON.parse(JSON.stringify(ex));S.isNew=false;S.screen=st.screen}
    else if(S.site&&S.site.id===st.siteId){S.screen=st.screen}
    else S.screen='liste'}
  else S.screen='liste';
  S.msg=S.pendingMsg||null;S.pendingMsg=null;S.armed=null;S.pushDepth=LV[S.screen]||0;render();window.scrollTo(0,0);
}

function drawPattern(){
  const svg=$('#pattern');const w=1400,h=520;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  const ph=['#ffed00','#c9c9c0','#b3b3aa','#ffed00'];const c='#b9b9b0';
  let s='';
  [40,66,92,118].forEach((y,i)=>s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${ph[i]}" stroke-width="3" opacity=".9"/>`);
  for(let i=0;i<26;i++){
    const x=60+i*54,bus=40+(i%4)*26,y0=180+(i%3)*14;
    s+=`<g stroke="${c}" stroke-width="1.3" opacity=".55"><line x1="${x}" y1="${bus}" x2="${x}" y2="${y0}"/><line x1="${x}" y1="${y0+34}" x2="${x-11}" y2="${y0+8}"/><line x1="${x-4}" y1="${y0-4}" x2="${x+4}" y2="${y0+4}"/><line x1="${x-4}" y1="${y0+4}" x2="${x+4}" y2="${y0-4}"/><line x1="${x}" y1="${y0+34}" x2="${x}" y2="${h}" opacity=".6"/></g><circle cx="${x}" cy="${bus}" r="3" fill="${c}" opacity=".4"/>`;
  }

function validate(p){
  const miss=[];
  if(!p.kom.trim())miss.push('Kommissionsnummer');
  if(!p.adr.trim())miss.push('Strasse');
  if(!p.plz.trim())miss.push('PLZ');
  if(!p.ort.trim())miss.push(p.land==='DE'?'Stadt':'Ort');
  if(p.land==='CH'&&!p.kanton)miss.push('Kanton');
  if(miss.length)return 'Gespeichert als angefangene Baustelle. Es fehlt noch: '+miss.join(', ')+'.';
  const len={CH:4,LI:4,AT:4,DE:5,FR:5}[p.land];
  if(len&&!new RegExp('^\\d{'+len+'}$').test(p.plz.trim()))return `Gespeichert. Bitte die PLZ prüfen, in ${landName(p.land)} hat sie ${len} Ziffern.`;

}

function onPlz(){
  const p=S.site,L=PLZ[p.land];if(!L)return;
  const z=p.plz.trim();
  /* Vorschläge erst ab 3 Ziffern und nur wenige, damit man frei weitertippen kann */
  const zips=z.length>=3?[...L.byZip.keys()].filter(k=>k.startsWith(z)&&k!==z).slice(0,8):[];
  fillDl('dlPlz',zips);
  const hit=L.byZip.get(z);
  if(hit){
    fillDl('dlOrt',[...new Set(hit.map(h=>h.o))]);
    if(!p.ort||p._autoOrt===p.ort||!hit.some(h=>h.o===p.ort)){setField('ort',hit[0].o);p._autoOrt=hit[0].o}
    if(p.land==='CH'&&hit[0].k){setField('kanton',hit[0].k)}

  const p=S.site,L=PLZ[p.land];if(!L)return;

/* ---------- Planung ---------- */
const QS=['1.5','2.5','4','6','10','16','25','35','50','70','95','120','150','185','240'];
const QS_MAX=16;
const NB_LIST=['IWB Industrielle Werke Basel','Primeo Energie','EBL Genossenschaft Elektra Baselland','AEW Energie AG','BKW Energie AG','CKW AG','EKZ Elektrizitätswerke des Kantons Zürich','Netze BW GmbH','ED Netze GmbH','bnNETZE GmbH'];
const qsNum=q=>parseFloat(String(q).replace(',','.'))||0;
const qsTxt=q=>String(q).replace('.',',');
function planOf(s){if(s.plan&&!s.plan.klAbg)s.plan.klAbg='ja';if(!s.plan)s.plan={step:s.art==='HV'?'unterlagen':'smarthome',qs:'',adern:'5',nb:'',nbAuto:false,material:false,revs:[]};const pl=s.plan;if(!pl.revs)pl.revs=[];if(!pl.docs)pl.docs={deck:false,toc:false,klemmen:false};if(!Array.isArray(pl.sk))pl.sk=[];if(pl.step==='produkte')pl.step='stromkreise';if(!Array.isArray(pl.zl)||!pl.zl.length)pl.zl=[{id:1,name:'',res:false,bez:pl.bez||(s.norm==='VDE'?'NH':'DZ'),bezA:pl.bezA||'',qs:'',adern:pl.adern||'5',ziel:''}];pl.zl[0].res=false;if(s.geb==='MFH'&&!pl.zl[0].name)pl.zl[0].name='Allgemein';if(s.art==='HV'){pl.gehaeuse='alu';pl.montage='AP'}else if(pl.montage==='UP'){pl.gehaeuse='hersteller'}return pl}
const initials=n=>String(n||'').split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).join('').slice(0,3);
/* Netzbetreiber: zuerst was auf diesem Gerät für die PLZ gemerkt wurde, sonst sichere Regel (Basel-Stadt = IWB) */
function guessNB(s){
  D.nbMap=D.nbMap||{};
  const k=(s.land||'')+':'+(s.plz||'').trim();
  if(D.nbMap[k])return {name:D.nbMap[k],src:'gemerkt für PLZ '+s.plz};
  if(s.land==='CH'&&s.kanton==='BS')return {name:'IWB Industrielle Werke Basel',src:'Kanton Basel-Stadt'};
  return null;
}
function touchPlan(grund){
  const p=S.site,pl=planOf(p);const today=new Date().toISOString().slice(0,10);const gez=initials(S.user.name);
  const last=pl.revs[pl.revs.length-1];

async function newestV(){const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return (await r.json()).v||null}
function showNewVer(){if($('#newVer'))return;const d=document.createElement('div');d.id='newVer';d.style.cssText='position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:999;background:#111;color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:calc(100% - 32px)';d.innerHTML='<span>Neue Version verfügbar</span><button type="button" class="btn small primary" data-act="appUpdate">Aktualisieren</button>';document.body.appendChild(d)}
async function checkVersion(){try{const v=await newestV();if(v&&v!==APP_V)showNewVer()}catch(e){}}
try{$('#appV').textContent=APP_V}catch(e){}
checkVersion();setInterval(checkVersion,2*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});window.addEventListener('pageshow',checkVersion);window.addEventListener('focus',checkVersion);
})();
</script>
</body>
</html>
