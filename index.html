<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verteiler">
<title>Verteilerplanung Schachenmann</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: schwarzes Kopfband mit Logo, gelbe Akzentlinie, darunter Karten. Farben Schwarz/Gelb nach Schachenmann. */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --ink:#141414; --muted:#5f5f5a; --line:#dcdcd5; --field:#ffffff;
  --head:#0b0b0b; --accent:#ffed00; --accent-ink:#111111; --link:#5c5200; --focus:#111111;
  --err:#b42318; --err-soft:#fdecea; --ok:#1d7a46; --ok-soft:#e3f3e9;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0e0d; --surface:#191918; --ink:#f0f0ec; --muted:#a3a39c; --line:#2e2e2b; --field:#121211;
  --head:#050505; --link:#ffed00; --focus:#ffed00;
  --err:#ff8a80; --err-soft:#3a1714; --ok:#6fd39a; --ok-soft:#10301e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* Kopfband */
.hero{position:relative;background:var(--head);color:#f3f3ef;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.hero svg.pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.hero .yb{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--accent)}
.hero .in{position:relative;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 120px;display:flex;flex-direction:column;gap:40px}
.hero.start .in{padding-block:56px 150px;gap:0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;min-height:44px}
.logo img{height:44px;max-width:240px;object-fit:contain;display:block}
.hero.start .logo img{height:clamp(64px,12vw,110px);max-width:min(100%,520px)}
.wordmark{font:800 24px/1 var(--f-display);letter-spacing:-.01em;color:#fff;display:flex;align-items:baseline;gap:8px}
.wordmark i{font-style:normal;color:var(--accent)}
.hero.start .wordmark{font-size:clamp(26px,8vw,72px)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.topbar .who{opacity:.85;margin-right:4px}
.topbar .btn{background:transparent;border-color:rgba(255,255,255,.35);color:#f3f3ef}
.topbar .btn:hover{border-color:var(--accent);color:var(--accent)}
.pagehead h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em;color:#fff}

/* Inhalt */
.main{max-width:1080px;margin:-90px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));position:relative;display:flex;flex-direction:column;gap:20px}
.hero.start + .main{margin-top:-110px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:4px;padding:24px;box-shadow:0 18px 40px -24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:18px;min-width:0}
.card.narrow{max-width:440px;width:100%}
.card h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted)}
input,select{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#111;color:var(--accent);border-color:#111}
.btn.small{padding:7px 11px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--link);font-weight:600}
.btn.danger{color:var(--err)}
.msg{border-radius:4px;padding:10px 12px;font-size:14px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:640px){.c4,.c3,.c2{grid-column:span 6}.card{padding:18px}}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;padding:3px;gap:3px;background:var(--bg)}
.seg button{flex:1;border:0;background:none;border-radius:3px;padding:9px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}
.seg button b{font:700 15px var(--f-display)}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#111}
.seg button[aria-pressed="true"] span{color:#3a3a00}
.legend{font-size:13px;font-weight:600;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.y{background:var(--accent);color:#111;border-color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:0 -24px -24px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:2}
@media (max-width:640px){.actions{margin:0 -18px -18px;padding-left:18px;padding-right:18px}}
.saved{font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.foot .btn.link{color:var(--muted);font-size:12px;font-weight:500}

/* Übersicht */
.tools{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tools{grid-template-columns:1fr 1fr}.tools .q{grid-column:span 2}}
.sites{display:flex;flex-direction:column}
.site{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.site:last-child{border-bottom:0}
.site .t{font:700 16px var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.site .d{color:var(--muted);font-size:14px}
.site .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.site .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.site{grid-template-columns:1fr}.site .acts{justify-content:flex-start}}
.muted{color:var(--muted);font-weight:500}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.ulist{display:flex;flex-direction:column}
.uitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.uitem:last-child{border-bottom:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hero" id="hero">
  <svg class="pattern" id="pattern" aria-hidden="true"></svg>
  <div class="yb" aria-hidden="true"></div>
  <div class="in">
    <div class="brandrow">
      <div class="logo" id="logo"></div>
      <div class="topbar" id="topbar"></div>
    </div>
    <div class="pagehead" id="pagehead"></div>
  </div>
</header>
<div class="main" id="main"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
const KEY='vp.v2';
const START_NAMES=['Cihad Mekikli','Marco Winkler','Shajatan Kumar','Mumin Jakupi','Tobias Müller','Lionel Mazard'];
const LAENDER=[['CH','Schweiz'],['LI','Liechtenstein'],['DE','Deutschland'],['AT','Österreich'],['FR','Frankreich']];
const KANTONE=[['AG','Aargau'],['AI','Appenzell Innerrhoden'],['AR','Appenzell Ausserrhoden'],['BE','Bern'],['BL','Basel-Landschaft'],['BS','Basel-Stadt'],['FR','Freiburg'],['GE','Genf'],['GL','Glarus'],['GR','Graubünden'],['JU','Jura'],['LU','Luzern'],['NE','Neuenburg'],['NW','Nidwalden'],['OW','Obwalden'],['SG','St. Gallen'],['SH','Schaffhausen'],['SO','Solothurn'],['SZ','Schwyz'],['TG','Thurgau'],['TI','Tessin'],['UR','Uri'],['VD','Waadt'],['VS','Wallis'],['ZG','Zug'],['ZH','Zürich']];
const nid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const now=()=>new Date().toISOString();

/* ---------- Speicher (localStorage dieses Browsers) ---------- */
let D;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
if(!D||!Array.isArray(D.users)) D={users:START_NAMES.map(n=>({id:nid(),name:n})),admin:null};
D.sites=D.sites||[];
// Übernahme aus der Vorversion (eine Baustelle pro Person)
if(D.projects){Object.entries(D.projects).forEach(([uid,p])=>{if(p&&(p.kom||p.adr)){D.sites.push({id:nid(),owner:uid,kom:p.kom||'',bauherr:'',adr:p.adr||'',plz:p.plz||'',ort:p.ort||'',kanton:'',land:p.land||'CH',norm:p.norm||'NIN',art:p.art||'UV',created:now(),updated:now()})}});delete D.projects}
delete D.branding;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){return false}}
save();

let S={screen:'start',user:null,admin:false,msg:null,sel:'',site:null,savedAt:null,q:'',fNorm:'',fKanton:'',fOrt:'',fWer:'mine',armed:null};

/* ---------- Passwort ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
    return 'p2$'+hex(bits);
  }
  let h=2166136261;const s=salt+pw;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'f1$'+(h>>>0).toString(16);
}
async function setPw(o,pw){o.salt=nid()+nid();o.hash=await hashPw(pw,o.salt)}
async function checkPw(o,pw){return o&&o.hash&&(await hashPw(pw,o.salt))===o.hash}

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(list,val)=>list.map(([k,l])=>`<option value="${esc(k)}"${k===val?' selected':''}>${esc(l)}</option>`).join('');
const msgHTML=()=>S.msg?`<div class="msg ${S.msg.t}" role="status">${esc(S.msg.m)}</div>`:'';
const sortedUsers=()=>[...D.users].sort((a,b)=>a.name.localeCompare(b.name,'de'));
const userName=id=>(D.users.find(u=>u.id===id)||{}).name||'unbekannt';
const landName=k=>(LAENDER.find(l=>l[0]===k)||[,k])[1];
const fmtDate=iso=>{try{return new Date(iso).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
const fmtTime=d=>d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
function go(screen,msg){S.screen=screen;S.msg=msg||null;S.armed=null;render();window.scrollTo(0,0)}
const complete=s=>!!(s.kom&&s.adr&&s.plz&&s.ort&&(s.land!=='CH'||s.kanton));

/* ---------- Logo: logo.svg oder logo.png im selben Ordner ---------- */
let LOGO=null;
function loadLogo(){
  const list=['logo.svg','logo.png','logo.jpg'];
  const tryNext=i=>{if(i>=list.length){LOGO=false;renderLogo();return}
    const im=new Image();im.onload=()=>{LOGO=list[i];renderLogo()};im.onerror=()=>tryNext(i+1);im.src=list[i]+'?v=1'};
  tryNext(0);
}
function renderLogo(){
  $('#logo').innerHTML=LOGO?`<img src="${LOGO}?v=1" alt="Schachenmann + Co AG">`:`<div class="wordmark" aria-label="Schachenmann + Co AG">SCHACHENMANN<i>+</i></div>`;
}

function drawPattern(){
  const svg=$('#pattern');const w=1400,h=520;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  const ph=['#ffed00','#8a8a84','#5a5a55','#ffed00'];const c='#d8d8d0';
  let s='';
  [70,96,122,148].forEach((y,i)=>s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${ph[i]}" stroke-width="3" opacity=".5"/>`);
  for(let i=0;i<26;i++){
    const x=60+i*54,bus=70+(i%4)*26,y0=210+(i%3)*14;
    s+=`<g stroke="${c}" stroke-width="1.3" opacity=".3"><line x1="${x}" y1="${bus}" x2="${x}" y2="${y0}"/><line x1="${x}" y1="${y0+34}" x2="${x-11}" y2="${y0+8}"/><line x1="${x-4}" y1="${y0-4}" x2="${x+4}" y2="${y0+4}"/><line x1="${x-4}" y1="${y0+4}" x2="${x+4}" y2="${y0-4}"/><line x1="${x}" y1="${y0+34}" x2="${x}" y2="${h}" opacity=".6"/></g><circle cx="${x}" cy="${bus}" r="3" fill="${c}" opacity=".4"/>`;
  }
  s+=`<defs><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0b0b0b" stop-opacity=".95"/><stop offset=".55" stop-color="#0b0b0b" stop-opacity=".35"/><stop offset="1" stop-color="#0b0b0b" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="${w}" height="${h}" fill="url(#fade)"/>`;
  svg.innerHTML=s;
}

/* ---------- Rendern ---------- */
const TITLES={liste:'Meine Baustellen',baustelle:'Baustelle',admin:'Verwaltung'};
function render(){
  const start=!S.user&&!S.admin;
  $('#hero').classList.toggle('start',start);
  $('#topbar').innerHTML=S.user
    ?`<span class="who">${esc(S.user.name)}</span>${S.screen!=='liste'?'<button class="btn small" data-act="liste">Übersicht</button>':''}<button class="btn small" data-act="logout">Abmelden</button>`
    :(S.admin?`<span class="who">Verwaltung</span><button class="btn small" data-act="adminOut">Verlassen</button>`:'');
  $('#pagehead').innerHTML=start?'':`<h1>${esc(S.screen==='baustelle'&&S.site&&S.site.kom?'Kommission '+S.site.kom:(TITLES[S.screen]||''))}</h1>`;
  const f={start:vStart,liste:vListe,baustelle:vBaustelle,adminLogin:vAdminLogin,admin:vAdmin}[S.screen]||vStart;
  $('#main').innerHTML=f();
  const af=$('#main [autofocus]');if(af&&window.innerWidth>700)af.focus({preventScroll:true});
}

function vStart(){
  const u=D.users.find(x=>x.id===S.sel);
  return `<section class="card narrow">
    <h2>Anmelden</h2>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:16px" novalidate>
      <label class="f">Planung läuft unter
        <select id="userSel"><option value="">Name wählen …</option>${opt(sortedUsers().map(x=>[x.id,x.name]),S.sel)}</select></label>
      ${u?(!u.hash?`
        <div class="msg ok">Erste Anmeldung. Lege jetzt dein persönliches Passwort fest.</div>
        <label class="f">Neues Passwort <span class="hint">mindestens 6 Zeichen</span><input id="pw1" type="password" autocomplete="new-password" autofocus></label>
        <label class="f">Passwort wiederholen<input id="pw2" type="password" autocomplete="new-password"></label>
        ${msgHTML()}<button class="btn primary" type="submit">Passwort speichern und starten</button>`
      :`<label class="f">Passwort<input id="pw" type="password" autocomplete="current-password" autofocus></label>
        ${msgHTML()}<button class="btn primary" type="submit">Anmelden</button>
        <p class="sub">Passwort vergessen? Die Verwaltung kann es zurücksetzen.</p>`):msgHTML()}
    </form>
  </section>
  <div class="foot"><button class="btn link" data-act="adminLogin">Verwaltung</button></div>`;
}

/* ---------- Übersicht ---------- */
function visibleSites(){
  const q=S.q.trim().toLowerCase();
  return D.sites.filter(s=>(S.fWer==='all'||s.owner===S.user.id)
    &&(!S.fNorm||s.norm===S.fNorm)
    &&(!S.fKanton||(S.fKanton==='_DE'?s.land==='DE':s.kanton===S.fKanton))
    &&(!S.fOrt||(s.ort||'').trim().toLowerCase()===S.fOrt)
    &&(!q||[s.kom,s.bauherr,s.adr,s.plz,s.ort,s.kanton,landName(s.land)].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
}
function siteListHTML(){
  const list=visibleSites();
  const total=D.sites.filter(s=>S.fWer==='all'||s.owner===S.user.id).length;
  if(!total) return `<div class="empty">Noch keine Baustellen gespeichert.<br>Lege mit «Neue Baustelle» die erste an.</div>`;
  if(!list.length) return `<div class="empty">Keine Baustelle passt zur Suche oder zum Filter.</div>`;
  return `<div class="sites">${list.map(s=>`<div class="site">
    <div>
      <div class="t">${s.kom?esc(s.kom):'<span class="muted">ohne Kommissionsnummer</span>'}${s.bauherr?`<span style="font-weight:500">· ${esc(s.bauherr)}</span>`:''}</div>
      <div class="d">${esc([s.adr,[s.plz,s.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ')||'Adresse fehlt')}</div>
      <div class="tags">
        <span class="tag y">${s.art}</span><span class="tag">${s.norm}</span>
        ${s.land==='CH'&&s.kanton?`<span class="tag">${s.kanton}</span>`:`<span class="tag">${esc(landName(s.land))}</span>`}
        ${complete(s)?'':'<span class="tag">angefangen</span>'}
        <span class="tag" title="zuletzt geändert">${fmtDate(s.updated)}${S.fWer==='all'?' · '+esc(userName(s.owner)):''}</span>
      </div>
    </div>
    <div class="acts">
      <button class="btn small primary" data-open="${s.id}">Öffnen</button>
      ${S.armed===s.id?`<button class="btn small danger" data-delsite="${s.id}">Wirklich löschen</button><button class="btn small" data-act="disarm">Abbrechen</button>`
      :`<button class="btn small danger" data-arm="${s.id}">Löschen</button>`}
    </div></div>`).join('')}</div>`;
}
function vListe(){
  const mine=D.sites.filter(s=>S.fWer==='all'||s.owner===S.user.id);
  const kantone=[...new Set(mine.filter(s=>s.land==='CH'&&s.kanton).map(s=>s.kanton))].sort();
  const hasDE=mine.some(s=>s.land==='DE');
  const orte=[...new Map(mine.filter(s=>s.ort).map(s=>[s.ort.trim().toLowerCase(),s.ort.trim()])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'de'));
  return `<section class="card">
    <div class="row between"><h2>Angefangene und gespeicherte Baustellen</h2><button class="btn primary" data-act="new">+ Neue Baustelle</button></div>
    <div class="tools">
      <label class="f q">Suche<input id="q" type="search" value="${esc(S.q)}" placeholder="Kommission, Bauherrschaft, Strasse, Ort …" autocomplete="off"></label>
      <label class="f">Norm<select id="fNorm">${opt([['','alle'],['NIN','NIN'],['VDE','VDE']],S.fNorm)}</select></label>
      <label class="f">Kanton<select id="fKanton">${opt([['','alle'],...kantone.map(k=>[k,k+' · '+(KANTONE.find(x=>x[0]===k)||[,''])[1]]),...(hasDE?[['_DE','Deutschland']]:[])],S.fKanton)}</select></label>
      <label class="f">Stadt / Ort<select id="fOrt">${opt([['','alle'],...orte],S.fOrt)}</select></label>
    </div>
    <div class="row"><label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="fWer" style="width:auto" ${S.fWer==='all'?'checked':''}> Baustellen aller Planer auf diesem Gerät zeigen</label></div>
    <div id="siteList">${siteListHTML()}</div>
  </section>
  <section class="card">
    <h2>Sicherung</h2>
    <p class="sub">Alles wird automatisch in diesem Browser gespeichert und bleibt auch nach dem Schliessen erhalten. Werden die Browserdaten gelöscht, ist es weg. Lade darum ab und zu eine Sicherungsdatei herunter. Mit ihr kannst du die Baustellen auch auf ein anderes Gerät bringen.</p>
    ${msgHTML()}
    <div class="row"><button class="btn" data-act="export">Sicherung herunterladen</button><button class="btn" data-act="import">Sicherung laden</button></div>
  </section>`;
}

/* ---------- Baustelle ---------- */
function vBaustelle(){
  const p=S.site;
  const seg=(k,opts)=>`<div class="seg" role="group">${opts.map(([v,t,s])=>`<button type="button" data-seg="${k}" data-v="${v}" aria-pressed="${p[k]===v}"><b>${t}</b><span>${s}</span></button>`).join('')}</div>`;
  const ch=p.land==='CH';
  return `<section class="card">
    <div class="row between"><h2>Baustellendaten</h2></div>
    <form id="bForm" class="grid" novalidate>
      <label class="f c2">Kommissionsnummer<input id="b-kom" data-b="kom" value="${esc(p.kom)}" placeholder="z. B. 24-0815" autofocus></label>
      <label class="f c4">Bauherrschaft<input id="b-bauherr" data-b="bauherr" value="${esc(p.bauherr)}" placeholder="Name oder Firma"></label>
      <label class="f c4">Strasse und Nummer<input id="b-adr" data-b="adr" value="${esc(p.adr)}" autocomplete="street-address"></label>
      <label class="f c2">Land<select id="b-land" data-b="land">${opt(LAENDER,p.land)}</select></label>
      <label class="f c2">PLZ<input id="b-plz" data-b="plz" value="${esc(p.plz)}" inputmode="numeric" placeholder="${p.land==='DE'||p.land==='FR'?'79539':'4051'}" autocomplete="postal-code"></label>
      <label class="f ${ch?'c2':'c4'}">${p.land==='DE'?'Stadt':'Ort'}<input id="b-ort" data-b="ort" value="${esc(p.ort)}" placeholder="${p.land==='DE'?'Lörrach':'Basel'}" autocomplete="address-level2"></label>
      ${ch?`<label class="f c2">Kanton<select id="b-kanton" data-b="kanton"><option value="">wählen …</option>${opt(KANTONE.map(([k,n])=>[k,k+' · '+n]),p.kanton)}</select></label>`:''}
      <div class="c3"><div class="legend">Zu behandelnde Norm</div>${seg('norm',[['NIN','NIN','Schweiz, SN 411000 (Standard)'],['VDE','VDE','Deutschland, DIN VDE 0100']])}</div>
      <div class="c3"><div class="legend">Art der Verteilung</div>${seg('art',[['UV','UV','Unterverteilung'],['HV','HV','Hauptverteilung']])}</div>
      <div class="c6" id="bMsg">${msgHTML()}</div>
      <div class="c6 actions">
        <span class="saved" id="savedInfo">${S.savedAt?'Gespeichert um '+fmtTime(S.savedAt):'Wird beim Tippen automatisch gespeichert'}</span>
        <div class="row"><button type="button" class="btn" data-act="saveSite">Speichern</button><button type="submit" class="btn primary">Speichern und zur Übersicht</button></div>
      </div>
    </form>
  </section>`;
}
function persistSite(){
  const p=S.site;p.updated=now();
  const i=D.sites.findIndex(s=>s.id===p.id);
  if(i<0)D.sites.push(p);else D.sites[i]=p;
  if(save()){S.savedAt=new Date();const el=$('#savedInfo');if(el)el.textContent='Gespeichert um '+fmtTime(S.savedAt);return true}
  const el=$('#savedInfo');if(el)el.textContent='Speichern fehlgeschlagen, der Gerätespeicher ist voll oder gesperrt';return false;
}
function validate(p){
  const miss=[];
  if(!p.kom.trim())miss.push('Kommissionsnummer');
  if(!p.adr.trim())miss.push('Strasse');
  if(!p.plz.trim())miss.push('PLZ');
  if(!p.ort.trim())miss.push(p.land==='DE'?'Stadt':'Ort');
  if(p.land==='CH'&&!p.kanton)miss.push('Kanton');
  if(miss.length)return 'Gespeichert als angefangene Baustelle. Es fehlt noch: '+miss.join(', ')+'.';
  const len={CH:4,LI:4,AT:4,DE:5,FR:5}[p.land];
  if(len&&!new RegExp('^\\d{'+len+'}$').test(p.plz.trim()))return `Gespeichert. Bitte die PLZ prüfen, in ${landName(p.land)} hat sie ${len} Ziffern.`;
  return null;
}

/* ---------- Verwaltung ---------- */
function vAdminLogin(){
  const first=!D.admin;
  return `<section class="card narrow">
    <h2>Verwaltung</h2>
    <p class="sub">${first?'Lege das Verwaltungspasswort fest. Es schützt das Anlegen von Namen und das Zurücksetzen von Passwörtern.':'Nur für die Verwaltung der Namen und Passwörter.'}</p>
    <form id="adminForm" style="display:flex;flex-direction:column;gap:16px" novalidate>
      <label class="f">${first?'Neues Verwaltungspasswort <span class="hint">mindestens 8 Zeichen</span>':'Verwaltungspasswort'}<input id="apw" type="password" autocomplete="${first?'new-password':'current-password'}" autofocus></label>
      ${first?'<label class="f">Passwort wiederholen<input id="apw2" type="password" autocomplete="new-password"></label>':''}
      ${msgHTML()}
      <div class="row between"><button type="button" class="btn link" data-act="home">Zurück</button><button class="btn primary" type="submit">${first?'Festlegen und öffnen':'Öffnen'}</button></div>
    </form>
  </section>`;
}
function vAdmin(){
  return `<div class="two">
  <section class="card">
    <h2>Namen</h2>
    <form id="addUser" class="row" novalidate>
      <input id="newName" placeholder="Vorname Nachname" style="flex:1 1 200px" autocomplete="off">
      <button class="btn primary" type="submit">Name anlegen</button>
    </form>
    ${msgHTML()}
    <div class="ulist">${sortedUsers().map(u=>`<div class="uitem">
      <div><div style="font-weight:600">${esc(u.name)}</div>${u.hash?'<span class="tag ok">Passwort gesetzt</span>':'<span class="tag">wartet auf erstes Passwort</span>'}</div>
      <div class="row">
        ${u.hash?(S.armed==='r'+u.id?`<button class="btn small danger" data-reset="${u.id}">Sicher zurücksetzen?</button>`:`<button class="btn small" data-arm="r${u.id}">Passwort zurücksetzen</button>`):''}
        ${S.armed==='d'+u.id?`<button class="btn small danger" data-del="${u.id}">Sicher entfernen?</button>`:`<button class="btn small danger" data-arm="d${u.id}">Entfernen</button>`}
      </div></div>`).join('')}</div>
  </section>
  <section class="card">
    <h2>Verwaltungspasswort ändern</h2>
    <form id="chAdmin" class="row" novalidate>
      <input id="newApw" type="password" placeholder="Neues Passwort, mind. 8 Zeichen" autocomplete="new-password" style="flex:1 1 200px">
      <button class="btn" type="submit">Ändern</button>
    </form>
  </section></div>`;
}

/* ---------- Ereignisse ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.b&&t.tagName==='INPUT'&&S.site){S.site[t.dataset.b]=t.value;clearTimeout(persistSite.t);persistSite.t=setTimeout(persistSite,400)}
  if(t.id==='q'){S.q=t.value;$('#siteList').innerHTML=siteListHTML()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='userSel'){S.sel=t.value;S.msg=null;render();return}
  if(t.dataset.b&&S.site){
    S.site[t.dataset.b]=t.value;
    if(t.dataset.b==='land'){if(t.value!=='CH')S.site.kanton='';persistSite();render();return}
    persistSite();return}
  if(t.id==='fNorm'){S.fNorm=t.value;$('#siteList').innerHTML=siteListHTML();return}
  if(t.id==='fKanton'){S.fKanton=t.value;$('#siteList').innerHTML=siteListHTML();return}
  if(t.id==='fOrt'){S.fOrt=t.value;$('#siteList').innerHTML=siteListHTML();return}
  if(t.id==='fWer'){S.fWer=t.checked?'all':'mine';S.fKanton='';S.fOrt='';render();return}
  if(t.id==='importFile'){
    const file=t.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{try{
        const o=JSON.parse(r.result);if(!Array.isArray(o.sites))throw 0;
        let n=0;o.sites.forEach(s=>{if(!s||!s.id)return;const i=D.sites.findIndex(x=>x.id===s.id);
          if(!D.users.some(u=>u.id===s.owner)){const nm=(o.users||[]).find(u=>u.id===s.owner);const ex=nm&&D.users.find(u=>u.name===nm.name);s.owner=ex?ex.id:S.user.id}
          if(i<0){D.sites.push(s);n++}else if((s.updated||'')>(D.sites[i].updated||'')){D.sites[i]=s;n++}});
        save();S.msg={t:'ok',m:n+' Baustellen aus der Sicherung übernommen.'};
      }catch(err){S.msg={t:'err',m:'Diese Datei ist keine Sicherung der Verteilerplanung.'}}
      t.value='';render()};
    r.readAsText(file);
  }
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='loginForm'){
    const u=D.users.find(x=>x.id===S.sel);
    if(!u){S.msg={t:'err',m:'Bitte zuerst einen Namen wählen.'};return render()}
    if(!u.hash){
      const a=$('#pw1').value,b=$('#pw2').value;
      if(a.length<6){S.msg={t:'err',m:'Das Passwort braucht mindestens 6 Zeichen.'};return render()}
      if(a!==b){S.msg={t:'err',m:'Die beiden Passwörter stimmen nicht überein.'};return render()}
      await setPw(u,a);save();
    }else if(!(await checkPw(u,$('#pw').value))){S.msg={t:'err',m:'Das Passwort stimmt nicht. Bitte nochmals versuchen.'};return render()}
    S.user=u;S.admin=false;return go('liste');
  }
  if(id==='bForm'){
    persistSite();const w=validate(S.site);
    return go('liste',w?{t:'err',m:w}:{t:'ok',m:'Baustelle '+S.site.kom+' gespeichert.'});
  }
  if(id==='adminForm'){
    const a=$('#apw').value;
    if(!D.admin){
      if(a.length<8){S.msg={t:'err',m:'Das Verwaltungspasswort braucht mindestens 8 Zeichen.'};return render()}
      if(a!==$('#apw2').value){S.msg={t:'err',m:'Die beiden Passwörter stimmen nicht überein.'};return render()}
      D.admin={};await setPw(D.admin,a);save();
    }else if(!(await checkPw(D.admin,a))){S.msg={t:'err',m:'Das Verwaltungspasswort stimmt nicht.'};return render()}
    S.admin=true;S.user=null;return go('admin');
  }
  if(id==='addUser'){
    const n=$('#newName').value.trim().replace(/\s+/g,' ');
    if(n.length<3){S.msg={t:'err',m:'Bitte Vor- und Nachnamen eingeben.'};return render()}
    if(D.users.some(u=>u.name.toLowerCase()===n.toLowerCase())){S.msg={t:'err',m:n+' gibt es schon.'};return render()}
    D.users.push({id:nid(),name:n});save();S.msg={t:'ok',m:n+' angelegt. Beim ersten Anmelden legt die Person ihr Passwort selbst fest.'};return render();
  }
  if(id==='chAdmin'){
    const a=$('#newApw').value;if(a.length<8){S.msg={t:'err',m:'Das neue Verwaltungspasswort braucht mindestens 8 Zeichen.'};return render()}
    await setPw(D.admin,a);save();S.msg={t:'ok',m:'Verwaltungspasswort geändert.'};return render();
  }
});

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const act=t.dataset.act;
  if(t.dataset.seg&&S.site){S.site[t.dataset.seg]=t.dataset.v;persistSite();
    t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return}
  if(act==='saveSite'){persistSite();const w=validate(S.site);S.msg=w?{t:'err',m:w}:{t:'ok',m:'Gespeichert.'};$('#bMsg').innerHTML=msgHTML();$('#pagehead').innerHTML=`<h1>${esc(S.site.kom?'Kommission '+S.site.kom:'Baustelle')}</h1>`;return}
  if(act==='new'){S.site={id:nid(),owner:S.user.id,kom:'',bauherr:'',adr:'',plz:'',ort:'',kanton:'',land:'CH',norm:'NIN',art:'UV',created:now(),updated:now()};S.savedAt=null;return go('baustelle')}
  if(t.dataset.open){S.site=JSON.parse(JSON.stringify(D.sites.find(s=>s.id===t.dataset.open)));S.savedAt=null;return go('baustelle')}
  if(t.dataset.arm){S.armed=t.dataset.arm;S.msg=null;if(S.screen==='liste'){$('#siteList').innerHTML=siteListHTML()}else render();return}
  if(act==='disarm'){S.armed=null;$('#siteList').innerHTML=siteListHTML();return}
  if(t.dataset.delsite){const s=D.sites.find(x=>x.id===t.dataset.delsite);D.sites=D.sites.filter(x=>x.id!==t.dataset.delsite);save();S.armed=null;return go('liste',{t:'ok',m:'Baustelle '+(s.kom||'')+' gelöscht.'})}
  if(act==='liste'){if(S.screen==='baustelle'&&S.site)persistSite();return go('liste')}
  if(act==='logout'){if(S.screen==='baustelle'&&S.site)persistSite();S.user=null;S.sel='';S.site=null;return go('start')}
  if(act==='adminLogin')return go('adminLogin');
  if(act==='adminOut'){S.admin=false;return go('start')}
  if(act==='home')return go('start');
  if(act==='export'){
    const data={app:'verteilerplanung',version:2,exported:now(),users:D.users.map(u=>({id:u.id,name:u.name})),sites:D.sites};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Verteilerplanung-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return}
  if(act==='import'){$('#importFile').click();return}
  if(t.dataset.reset){const u=D.users.find(x=>x.id===t.dataset.reset);delete u.hash;delete u.salt;save();S.armed=null;S.msg={t:'ok',m:'Passwort von '+u.name+' zurückgesetzt. Beim nächsten Anmelden wird ein neues festgelegt.'};return render()}
  if(t.dataset.del){const u=D.users.find(x=>x.id===t.dataset.del);D.users=D.users.filter(x=>x.id!==u.id);save();S.armed=null;S.msg={t:'ok',m:u.name+' entfernt. Seine Baustellen bleiben erhalten.'};return render()}
});

drawPattern();loadLogo();renderLogo();render();
})();
</script>
</body>
</html>
